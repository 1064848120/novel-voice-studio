[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-voice-studio"
version = "0.1.0"
description = "Windows desktop audiobook production studio for novels"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "huggingface_hub>=0.25", "numpy>=1.26"]

authors = [{name = "Novel Voice Studio contributors"}]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["audiobook", "novel", "tts", "breeze", "pyside6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/<你的账号>/novel-voice-studio"
Repository = "https://github.com/<你的账号>/novel-voice-studio"
Issues = "https://github.com/<你的账号>/novel-voice-studio/issues"

[project.scripts]
novel-voice-studio = "novel_studio.app:main"

[tool.setuptools.packages.find]
include = ["novel_studio*"]
